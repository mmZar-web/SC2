<style>
:root {
    --ink:#172d29;
    --muted:#637570;
    --line:#d9e4df;
    --paper:#fff;
    --green:#19644f;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:#f2f5f2;
    color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:15px;
    line-height:1.7;
}

header {
    background:#153c32;
    color:#fff;
    padding:48px max(28px,calc((100vw - 1000px)/2)) 42px;
}

.eyebrow {
    font-size:12px;
    letter-spacing:2px;
    color:#a4d5bd;
    font-weight:700;
}

h1 {
    font-size:34px;
    letter-spacing:-1px;
    margin:12px 0;
}

header p {
    color:#d2e4dc;
}

main {
    max-width:1000px;
    padding:32px 30px 70px;
    margin:auto;
}

.home {
    display:inline-block;
    margin-bottom:24px;
    color:var(--green);
    text-decoration:none;
    font-weight:700;
}

.release {
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px;
    margin-bottom:18px;
}

.release-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.version {
    font-size:22px;
    font-weight:700;
}

.date {
    font-size:13px;
    color:var(--muted);
}

.description {
    color:#33483e;
    margin:12px 0 20px;
}

.download {
    display:inline-block;
    background:var(--green);
    color:white;
    padding:10px 18px;
    border-radius:7px;
    text-decoration:none;
    font-weight:700;
}

.download:hover {
    background:#124c3c;
}

.latest {
    display:inline-block;
    font-size:11px;
    background:#e7f5e6;
    color:#277127;
    padding:2px 8px;
    border-radius:4px;
    margin-left:8px;
}

@media(max-width:700px) {
    header {
        padding:30px 18px;
    }

    h1 {
        font-size:27px;
    }

    main {
        padding:24px 12px;
    }

    .release-head {
        align-items:flex-start;
        flex-direction:column;
        gap:2px;
    }
}
</style>
</head>

<body>

            <span class="latest">최신 버전</span>

        <span class="date">2026-09-18</span>
